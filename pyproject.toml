[project]
name = "rekey"
version = "0.1.0"
description = "Local-first AI agent for credential hygiene: audit and rotate compromised, reused, and weak passwords."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Aditya Bhaskara" }]
keywords = ["security", "passwords", "agent", "browser-automation", "1password", "bitwarden"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "typer>=0.15.0",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx>=0.28",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
    "jinja2>=3.1",
    "browser-use>=0.4.0",
    "pyotp>=2.9",
    "rich>=13.9",
]

[project.scripts]
rekey = "rekey.cli:app"

[project.urls]
Repository = "https://github.com/adityabhas22/rekey"
Issues = "https://github.com/adityabhas22/rekey/issues"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "pytest-mock>=3.14",
    "respx>=0.22",        # httpx mocking
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rekey"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle, pyflakes
    "I",             # isort
    "B",             # bugbear
    "UP",            # pyupgrade
    "N",             # pep8-naming
    "S",             # bandit (security)
    "A",             # builtins
    "C4",            # comprehensions
    "SIM",           # simplify
    "RET",           # return
    "PTH",           # pathlib
    "RUF",           # ruff-specific
]
ignore = [
    "S101",  # assert is fine in tests
    "S603",  # subprocess call (we use it deliberately for op/bw CLIs)
    "S607",  # starting a process with a partial path (we use names like "op", "bw")
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PTH"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_decorators = false
# browser-use lacks complete type stubs as of writing
[[tool.mypy.overrides]]
module = ["browser_use.*", "browser_use"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "integration: tests that hit real network/external services (use `-m integration` to run only those; `-m 'not integration'` to skip)",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
